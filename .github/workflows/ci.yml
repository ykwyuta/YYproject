name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  project:
    name: YYproject (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: Swatinem/rust-cache@v2
        with:
          key: yyproject-${{ matrix.os }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: MCP over real stdin/stdout
        shell: bash
        run: |
          EXE=target/release/yyproject
          if [ "$RUNNER_OS" = Windows ]; then EXE="$EXE.exe"; fi
          python tools/test_mcp.py "$EXE"
      - name: Operating scenario through actual MCP
        shell: bash
        run: |
          EXE=target/release/yyproject
          if [ "$RUNNER_OS" = Windows ]; then EXE="$EXE.exe"; fi
          python tools/validate_operations.py "$EXE"
      - name: Management acceptance over actual MCP
        shell: bash
        run: |
          EXE=target/release/yyproject
          if [ "$RUNNER_OS" = Windows ]; then EXE="$EXE.exe"; fi
          python tools/test_management.py "$EXE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yyproject-management-${{ runner.os }}
          path: target/management-validation/
      - name: Streamable HTTP and PAT authentication
        shell: bash
        run: |
          EXE=target/release/yyproject
          if [ "$RUNNER_OS" = Windows ]; then EXE="$EXE.exe"; fi
          python tools/test_http.py "$EXE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yyproject-operations-${{ runner.os }}
          path: target/operations-validation/
      - name: Native Windows views, dialogs, resizing and kanban
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $taskExe = (Resolve-Path target/release/yyprojectw.exe).Path
          $taskDir = Join-Path (Get-Location) 'target/ui-smoke'
          $taskProcess = Start-Process -FilePath $taskExe -ArgumentList '--ui-smoke-test',"`"$taskDir`"" -WindowStyle Hidden -PassThru
          if (-not $taskProcess.WaitForExit(60000)) { $taskProcess.Kill(); $taskProcess.WaitForExit(); throw 'yyproject UI smoke timed out' }
          if ($taskProcess.ExitCode -ne 0) { Get-Content "$taskDir/error.txt" -ErrorAction SilentlyContinue; throw 'yyproject UI smoke failed' }
          Get-Content "$taskDir/ui-smoke.txt"
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Windows'
        with:
          name: yyproject-ui-diagnostics
          path: target/ui-smoke/
      - name: Package binaries, help and notices
        run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: yyproject-${{ runner.os }}-x64
          path: target/dist/*
          if-no-files-found: error

  postgres:
    name: PostgreSQL migration and MCP (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: yyproject_test
          POSTGRES_USER: yyproject
          POSTGRES_PASSWORD: yyproject-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yyproject -d yyproject_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      YYPROJECT_DATABASE_URL: postgresql://yyproject:yyproject-test-only@127.0.0.1:5432/yyproject_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - name: Real PostgreSQL and bidirectional SQLite migration
        run: python tools/test_postgres.py target/debug/yyproject
      - name: Streamable HTTP against PostgreSQL
        run: python tools/test_http.py target/debug/yyproject --postgres
