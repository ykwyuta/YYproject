services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: yyproject
      POSTGRES_USER: yyproject
      POSTGRES_PASSWORD: ${YYPROJECT_POSTGRES_PASSWORD:?Set YYPROJECT_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${YYPROJECT_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yyproject -d yyproject"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  postgres-data:
